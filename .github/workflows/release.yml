name: PatchWise Release

on:
  push:
    branches: [main]

jobs:
  release:
    name: "🚀 Release — Tag & Publish"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(cat frontend/package.json | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "PatchWise v${{ steps.version.outputs.version }}"
          body: |
            ## PatchWise Release v${{ steps.version.outputs.version }}
            🔍 CHANAKYA (Reviewer) + 🛠️ ARYABHATA (Developer) — Autonomous Patch Review System

            ### What's New
            See commit history for full changelog.
          draft: false
          prerelease: false
