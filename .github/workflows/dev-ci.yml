name: PatchWise Dev CI

on:
  push:
    branches: [ develop, feature/*, release/* ]
  pull_request:
    branches: [ develop, main ]

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Lint backend
        run: ruff check backend/
      - name: Run backend tests
        run: pytest backend/tests/ -v

  frontend-lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: |
          cd frontend
          npm ci
      - name: Lint frontend
        run: |
          cd frontend
          npm run lint
      - name: Build frontend
        run: |
          cd frontend
          npm run build

  integration-check:
    needs: [backend-lint-test, frontend-lint-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check API contract
        run: echo "API contract check passed — extend with Pact tests in Phase 3"
